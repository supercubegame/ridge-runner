name: G0 bounded account metadata read
on:
  push:
    branches: [audit/g0-sdk-transport-20260920]
    paths: [tools/g0_account_read.py, tools/g0_account_gate.py, .github/workflows/g0-account-read.yml]
permissions:
  contents: read
concurrency:
  group: g0-account-read-20260920
  cancel-in-progress: false
jobs:
  readonly:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install fixed SDK without credentials
        run: |
          python3 -m venv /tmp/g0
          /tmp/g0/bin/pip install --disable-pip-version-check 'git+https://github.com/Lightning-AI/sdk.git@a7709959692a4abdcd152f381585eb1de826923b#subdirectory=python'
      - name: Credential-free transport regression
        run: |
          timeout 90 /tmp/g0/bin/python tools/g0_sdk_fixture.py
          timeout 90 /tmp/g0/bin/python tools/g0_response_fixture.py
          timeout 90 /tmp/g0/bin/python tools/g0_account_gate.py
          rm out/studio-probe.json
      - name: Bounded account GET-only snapshot
        env:
          LIGHTNING_USER_ID: ${{ secrets.LIGHTNING_USER_ID }}
          LIGHTNING_API_KEY: ${{ secrets.LIGHTNING_API_KEY }}
        run: timeout 120 /tmp/g0/bin/python tools/g0_account_read.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: g0-account-${{ github.sha }}
          path: out/*.json
          if-no-files-found: error
          retention-days: 30
  evidence:
    needs: readonly
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: g0-account-${{ github.sha }}
          path: out
      - name: Publish only account snapshot, never fixture as account success
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -c "import json; r=json.load(open('out/studio-probe.json')); assert r['kind']=='g0_account_read_v1'"
          python3 tools/probe_report.py

name: G0 template details and creation serialization
on:
  push:
    branches: [audit/g0-sdk-transport-20260920]
    paths: [tools/g0_template_check.py, .github/workflows/g0-template-check.yml]
permissions:
  contents: read
concurrency:
  group: g0-template-check-20260920
  cancel-in-progress: false
jobs:
  check:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      LIGHTNING_DISABLE_VERSION_CHECK: '1'
      LIGHTNING_DEBUG: '0'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install fixed SDK without credentials
        run: |
          python3 -m venv /tmp/g0
          /tmp/g0/bin/pip install --disable-pip-version-check 'git+https://github.com/Lightning-AI/sdk.git@a7709959692a4abdcd152f381585eb1de826923b#subdirectory=python'
      - name: No-network creation and detail fixture
        run: timeout 90 /tmp/g0/bin/python tools/g0_template_check.py --self-test
      - name: Three bounded GETs only
        env:
          LIGHTNING_USER_ID: ${{ secrets.LIGHTNING_USER_ID }}
          LIGHTNING_API_KEY: ${{ secrets.LIGHTNING_API_KEY }}
        run: timeout 70 /tmp/g0/bin/python tools/g0_template_check.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: g0-template-${{ github.sha }}
          path: out/*.json
          if-no-files-found: error
          retention-days: 30
  evidence:
    needs: check
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: g0-template-${{ github.sha }}
          path: out
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -c "import json,pathlib; p=pathlib.Path('out/studio-probe.json'); f=json.load(open('out/g0-template-fixture.json')); r=json.loads(p.read_text()) if p.exists() else {'kind':'g0_template_gate_failure','status':'FAIL','account_read':'NOT_RUN'}; r['fixture']=f; p.write_text(json.dumps(r,indent=2))"
          python3 tools/probe_report.py

name: Lightning API read-only audit
on:
  push:
    branches: [audit/lightning-api-readonly]
    paths: [tools/lightning_readonly.py, .github/workflows/lightning-api-readonly.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lightning-api-readonly
  cancel-in-progress: false
jobs:
  gate:
    if: github.repository == 'supercubegame/ridge-runner' && github.ref == 'refs/heads/audit/lightning-api-readonly'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python3 tools/lightning_readonly.py --self-test
  probe:
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install audited SDK source without account credentials
        run: |
          python3 -m venv /tmp/lightning-audit-venv
          /tmp/lightning-audit-venv/bin/pip install --disable-pip-version-check 'git+https://github.com/Lightning-AI/sdk.git@a7709959692a4abdcd152f381585eb1de826923b#subdirectory=python'
      - name: CLI executable smoke without account credentials
        run: /tmp/lightning-audit-venv/bin/lightning studio --help >/dev/null
      - name: Query existing Studio with GET-only transport
        id: api
        continue-on-error: true
        env:
          LIGHTNING_USER_ID: ${{ secrets.LIGHTNING_USER_ID }}
          LIGHTNING_API_KEY: ${{ secrets.LIGHTNING_API_KEY }}
          DO_NOT_TRACK: '1'
        run: timeout 120 /tmp/lightning-audit-venv/bin/python tools/lightning_readonly.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: lightning-api-${{ github.sha }}
          path: out/studio-probe.json
          if-no-files-found: error
          retention-days: 3
      - name: Require actual API probe success
        if: always()
        env:
          RESULT: ${{ steps.api.outcome }}
        run: test "$RESULT" = success
  evidence:
    needs: [gate, probe]
    if: always() && github.repository == 'supercubegame/ridge-runner' && github.ref == 'refs/heads/audit/lightning-api-readonly'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        continue-on-error: true
        with:
          name: lightning-api-${{ github.sha }}
          path: out
      - name: Publish redacted evidence with no Lightning credentials
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/probe_report.py

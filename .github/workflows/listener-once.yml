name: One approved runtime listener inspection
on:
  push:
    branches: [audit/listener-once-20260920]
    paths: [tools/listener_once.py, .github/workflows/listener-once.yml]
permissions:
  contents: read
concurrency:
  group: listener-inspection-one-approval-20260920-1104
  cancel-in-progress: false
jobs:
  gate:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python3 tools/listener_once.py --self-test
  inspect:
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: |
          python3 -m venv /tmp/listener-sdk
          /tmp/listener-sdk/bin/pip install --disable-pip-version-check 'git+https://github.com/Lightning-AI/sdk.git@a7709959692a4abdcd152f381585eb1de826923b#subdirectory=python'
      - name: Create and read back single-use receipt
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/listener_once.py --claim
      - id: probe
        continue-on-error: true
        env:
          LIGHTNING_USER_ID: ${{ secrets.LIGHTNING_USER_ID }}
          LIGHTNING_API_KEY: ${{ secrets.LIGHTNING_API_KEY }}
          DO_NOT_TRACK: '1'
        run: timeout 150 /tmp/listener-sdk/bin/python tools/listener_once.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: listener-${{ github.sha }}
          path: out/studio-probe.json
          if-no-files-found: error
      - if: always()
        env:
          RESULT: ${{ steps.probe.outcome }}
        run: test "$RESULT" = success
  evidence:
    needs: [gate, inspect]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        continue-on-error: true
        with:
          name: listener-${{ github.sha }}
          path: out
      - env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/probe_report.py

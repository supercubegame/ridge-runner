name: Approved 17:17 network capability only preflight
on:
  push:
    branches: [audit/net-capability-once-20260920]
    paths: [tools/net_capability_once.py, .github/workflows/net-capability-once.yml]
permissions:
  contents: read
concurrency:
  group: net-capability-20260920-1717
  cancel-in-progress: false
jobs:
  inspect:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python3 tools/net_capability_once.py --self-test
      - name: Install pinned SDK without credentials
        run: |
          python3 -m venv /tmp/sdk
          /tmp/sdk/bin/pip install --disable-pip-version-check 'git+https://github.com/Lightning-AI/sdk.git@a7709959692a4abdcd152f381585eb1de826923b#subdirectory=python'
      - name: Claim single-use 17:17 approval
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/net_capability_once.py --claim
      - id: probe
        continue-on-error: true
        env:
          LIGHTNING_USER_ID: ${{ secrets.LIGHTNING_USER_ID }}
          LIGHTNING_API_KEY: ${{ secrets.LIGHTNING_API_KEY }}
          DO_NOT_TRACK: '1'
        run: timeout 150 /tmp/sdk/bin/python tools/net_capability_once.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: capability-${{ github.sha }}
          path: out/studio-probe.json
          if-no-files-found: error
          retention-days: 7
      - if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/probe_report.py
      - if: always()
        env:
          RESULT: ${{ steps.probe.outcome }}
        run: test "$RESULT" = success

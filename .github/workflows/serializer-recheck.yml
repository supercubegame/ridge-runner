name: SDK serializer recheck without platform access
on:
  push:
    branches: [audit/recheck-serializer-20260920]
    paths: [tools/serializer_recheck.py, .github/workflows/serializer-recheck.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: |
          python3 -m venv /tmp/sdk
          /tmp/sdk/bin/pip install --disable-pip-version-check 'git+https://github.com/Lightning-AI/sdk.git@a7709959692a4abdcd152f381585eb1de826923b#subdirectory=python'
      - id: probe
        continue-on-error: true
        env:
          DO_NOT_TRACK: '1'
        run: /tmp/sdk/bin/python tools/serializer_recheck.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: serializer-${{ github.sha }}
          path: out/studio-probe.json
          if-no-files-found: error
      - if: always()
        env:
          RESULT: ${{ steps.probe.outcome }}
        run: test "$RESULT" = success
  evidence:
    needs: probe
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        continue-on-error: true
        with:
          name: serializer-${{ github.sha }}
          path: out
      - env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/probe_report.py

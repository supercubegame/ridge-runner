name: One approved URL autowake experiment
on:
  push:
    branches: [audit/studio-autowake-once-20260920]
    paths: [tools/autowake_once.py, tools/test_autowake_once.py, .github/workflows/studio-autowake-once.yml]
permissions:
  contents: read
concurrency:
  group: studio-autowake-one-authorization-20260920-0854
  cancel-in-progress: false
jobs:
  gate:
    if: github.repository == 'supercubegame/ridge-runner' && github.ref == 'refs/heads/audit/studio-autowake-once-20260920' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: |
          python3 tools/test_restart_once.py
          python3 tools/test_autowake_once.py
  autowake:
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Prepare dependencies without Lightning credentials
        run: |
          python3 -m venv /tmp/lightning-autowake-venv
          /tmp/lightning-autowake-venv/bin/pip install --disable-pip-version-check 'git+https://github.com/Lightning-AI/sdk.git@a7709959692a4abdcd152f381585eb1de826923b#subdirectory=python'
          npm install --no-save --package-lock=false playwright@1.51.1
          npx playwright install --with-deps chromium
          python3 tools/autowake_once.py --prepare
      - name: Read-only endpoint and machine preflight
        env:
          LIGHTNING_USER_ID: ${{ secrets.LIGHTNING_USER_ID }}
          LIGHTNING_API_KEY: ${{ secrets.LIGHTNING_API_KEY }}
          DO_NOT_TRACK: '1'
        run: timeout 240 /tmp/lightning-autowake-venv/bin/python tools/autowake_once.py --preflight
      - name: Atomically consume one-use authorization
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/autowake_once.py --claim
      - name: Enable, stop once, URL-only wake and browser verification
        id: experiment
        continue-on-error: true
        env:
          LIGHTNING_USER_ID: ${{ secrets.LIGHTNING_USER_ID }}
          LIGHTNING_API_KEY: ${{ secrets.LIGHTNING_API_KEY }}
          DO_NOT_TRACK: '1'
        run: /tmp/lightning-autowake-venv/bin/python tools/autowake_once.py --execute
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: autowake-${{ github.sha }}
          path: out/studio-probe.json
          if-no-files-found: error
          retention-days: 7
      - name: Require complete experiment success
        if: always()
        env:
          RESULT: ${{ steps.experiment.outcome }}
        run: |
          test "$RESULT" = success
          python3 -c "import json; assert json.load(open('out/studio-probe.json'))['status']=='PASS'"
  evidence:
    needs: [gate, autowake]
    if: always() && github.repository == 'supercubegame/ridge-runner' && github.ref == 'refs/heads/audit/studio-autowake-once-20260920'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        continue-on-error: true
        with:
          name: autowake-${{ github.sha }}
          path: out
      - name: Publish and read back redacted evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/probe_report.py

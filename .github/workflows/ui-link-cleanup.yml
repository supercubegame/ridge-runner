name: Approved exact UI-link endpoint cleanup
on:
  push:
    branches: [audit/ui-link-cleanup-20260920]
    paths: [tools/cleanup_ui_link.py, .github/workflows/ui-link-cleanup.yml]
permissions:
  contents: read
concurrency:
  group: ui-link-cleanup-20260920-1141
  cancel-in-progress: false
jobs:
  gate:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python3 tools/cleanup_ui_link.py --self-test
  probe:
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install fixed SDK without credentials
        run: |
          python3 -m venv /tmp/ui-sdk
          /tmp/ui-sdk/bin/pip install --disable-pip-version-check 'git+https://github.com/Lightning-AI/sdk.git@a7709959692a4abdcd152f381585eb1de826923b#subdirectory=python'
      - name: Consume cleanup authorization
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/cleanup_ui_link.py --claim
      - id: execute
        continue-on-error: true
        env:
          LIGHTNING_USER_ID: ${{ secrets.LIGHTNING_USER_ID }}
          LIGHTNING_API_KEY: ${{ secrets.LIGHTNING_API_KEY }}
          DO_NOT_TRACK: '1'
        run: timeout 240 /tmp/ui-sdk/bin/python tools/cleanup_ui_link.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: cleanup-${{ github.sha }}
          path: out/studio-probe.json
          if-no-files-found: error
          retention-days: 7
      - if: always()
        env:
          RESULT: ${{ steps.execute.outcome }}
        run: test "$RESULT" = success
  evidence:
    needs: [gate, probe]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        continue-on-error: true
        with:
          name: cleanup-${{ github.sha }}
          path: out
      - env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/probe_report.py
